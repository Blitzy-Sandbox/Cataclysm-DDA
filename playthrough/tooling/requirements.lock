 --hash=sha256:c7e46fcec401dd990405049d2e2f475e2b397779df2519b544b8aab515195282

# Transitive.  Pinned and hashed because --no-deps installs exactly
# what is listed, so an incomplete closure would leave a broken
# interpreter rather than resolve quietly.
