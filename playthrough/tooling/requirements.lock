# ---------------------------------------------------------------------
# playthrough/tooling/requirements.lock
#
# The hash-locked, binary-only install manifest for the playthrough
# capture and cinematography pipeline.
#
# requirements.txt beside this file is the DECLARATION: the six
# libraries the pipeline uses, in the shape the repository's own
# precedent established (tools/json_tools/requirements.txt).  This file
# is the INSTALL CONTRACT: the same six pins plus their complete
# transitive closure, every one bound to the sha256 of one specific
# wheel, so that what lands in the interpreter is byte for byte what
# was reviewed.  Exact versions alone stop drift; only hashes stop
# substitution.
#
# INSTALL EXACTLY LIKE THIS, from the repository root:
#
#     <interpreter> -m pip install --no-deps \
#         -r playthrough/tooling/requirements.lock
#
#   * --require-hashes and --only-binary :all: are set IN THIS FILE, a
#     few lines below, so that they cannot be forgotten on a command
#     line.  pip then refuses any artifact whose sha256 is not listed
#     here, and refuses to build anything from source -- no setup.py
#     from an unreviewed sdist ever executes.
#   * --no-deps is REQUIRED, and it is a deliberate, documented
#     decision rather than a shortcut.  Every dependency of every
#     package below is already pinned and hashed here -- the closure is
#     complete, which is both what makes disabling resolution safe and
#     what makes --require-hashes satisfiable at all, since pip refuses
#     a hash-checking install in which anything is unpinned.  Nothing
#     is being hidden from the resolver: these pins satisfy every
#     requirement the packages themselves declare, so `pip check` on
#     the resulting interpreter is silent and installing
#     requirements.txt WITH resolution reaches the same versions.  The
#     lock exists to fix the bytes, not to escape a conflict.
#     Installing without it must also succeed; if it ever does
#     not, a pin and a declared range have drifted apart, and that
#     is the defect to fix rather than a flag to add.
#
# THE CLOSURE, AND WHY EACH ENTRY IS HERE
#   Direct (declared in requirements.txt): moviepy, pillow,
#   pytesseract, numpy, imageio, imageio-ffmpeg.
#   Transitive, and required by exactly these:
#     decorator, proglog, python-dotenv  <- moviepy
#     tqdm                               <- proglog
#     packaging                          <- pytesseract
#   Nothing else resolves in on Linux: tqdm's colorama is
#   `platform_system == "Windows"` and every other requirement of every
#   package here is an extra this pipeline never asks for.
#
# PLATFORM
#   These are the CPython 3.12 wheels for manylinux x86_64, which is
#   the platform the pipeline is verified on.  numpy and pillow ship
#   per-interpreter binaries, so a different interpreter or
#   architecture needs its own lock; regenerate it rather than relaxing
#   this one.
#
# HOW TO REGENERATE, AND HOW THESE HASHES WERE OBTAINED
#     python -m pip download --only-binary :all: --no-deps \
#         -d <dir> --python-version 3.12 --implementation cp \
#         --platform manylinux_2_28_x86_64 <every pin below>
#     python -m pip hash <dir>/*.whl
#   Each sha256 below was then cross-checked against the `digests`
#   field PyPI publishes for that exact filename, so the value in this
#   file is corroborated by the index and not merely by the download.
#
# FORMAT NOTE
#   A hash is 78 characters, so it sits on its own continuation line to
#   keep this file inside the repository's 79-column house width.  The
#   single leading space is deliberate: 78 + 1 is exactly 79.
# ---------------------------------------------------------------------

--only-binary :all:
--require-hashes

# Fade, "...time passes..." card and fade-in composition.
moviepy==2.2.1 \
 --hash=sha256:6b56803fec2ac54b557404126ac1160e65448e03798fa282bd23e8fab3795060

# PNG inspection, title-card composition, MoviePy's image backend and
# the OCR module's decoder.  11.3.0 is the last release of the 11 line
# and the newest Pillow inside the `pillow<12.0` range moviepy 2.2.1
# declares, which is what keeps this closure resolvable; requirements.txt
# records the advisory measurement behind choosing that consistency
# over a newer major.  The hash is the cp312 manylinux_2_28 x86_64
# wheel, i.e. the artifact the regeneration command above selects on
# this platform.
pillow==11.3.0 \
 --hash=sha256:676b2815362456b5b3216b4fd5bd89d362100dc6f4945154ff172e206a22c024

# Sidebar clock OCR wrapper around the tesseract binary.
pytesseract==0.3.13 \
 --hash=sha256:7a99c6c2ac598360693d83a416e36e0b33a67638bb9d77fdcac094a3589d4b34

# Frame luminance statistics and MoviePy's array representation.
numpy==2.5.1 \
 --hash=sha256:59fda5e192b570217ec2580c96f00e9a7e12ef6866a900eb089b62c1a32545ca

# Frame and video IO used by MoviePy.
imageio==2.37.4 \
 --hash=sha256:1ab2e22c8debf700f24c3ac43e8f95f3b3a8110c83b93411e97b4b0b2cd1c7e6

# The encoder bridge.  Its wheel carries a bundled static ffmpeg that
